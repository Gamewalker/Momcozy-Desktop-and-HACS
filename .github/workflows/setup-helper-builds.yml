name: Native setup helpers
on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'scripts/build_setup_helper.py'
      - 'requirements*.txt'
      - '.github/workflows/setup-helper-builds.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'scripts/build_setup_helper.py'
      - 'requirements*.txt'
      - '.github/workflows/setup-helper-builds.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-amd64
            goTarget: windows/amd64
          - runner: ubuntu-22.04
            target: linux-amd64
            goTarget: linux/amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            goTarget: linux/arm64
          - runner: macos-15-intel
            target: darwin-amd64
            goTarget: darwin/amd64
          - runner: macos-14
            target: darwin-arm64
            goTarget: darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: python -m pip install -r requirements-setup-build.txt
      # Unicorn's JIT is incompatible with the stock Windows CFG bootloader.
      # Rebuild this helper's bootloader only; never alter Windows mitigations.
      - if: runner.os == 'Windows'
        run: python -m pip install --force-reinstall --no-binary pyinstaller --no-cache-dir PyInstaller==6.22.2
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
          PYINSTALLER_BOOTLOADER_WAF_ARGS: '--no-cfg'
      - run: python scripts/build_setup_helper.py --output artifacts/setup-helper
      - name: Bundle desktop and native helper
        shell: bash
        run: |
          version=v0.2.0-dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          python scripts/release.py --version "$version" --target '${{ matrix.goTarget }}' --setup-helper artifacts/setup-helper --output release
      # Tar preserves executable permissions through artifact upload/download.
      - run: tar -czf setup-helper-${{ matrix.target }}.tar.gz -C artifacts setup-helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: setup-helper-${{ matrix.target }}
          path: setup-helper-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-with-setup-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
