name: Home Assistant integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  bridge-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (Node.js 24)
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Install FFmpeg from Ubuntu repositories
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y ffmpeg
      - run: go test ./...
        working-directory: bridge
        env:
          MOMCOZY_TEST_FFMPEG: /usr/bin/ffmpeg
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node.js 24)
        with:
          python-version: '3.14'
      - name: Install media libraries from Ubuntu repositories
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y libturbojpeg ffmpeg
      - run: python -m pip install -r tests/home_assistant/requirements.txt
      - run: python -m unittest tests.client.test_home_assistant_app -v
      - run: python -m unittest discover -s tests/home_assistant -p test_rtsp.py -v
      - run: python -m pytest -o asyncio_mode=auto tests/home_assistant/test_integration.py
