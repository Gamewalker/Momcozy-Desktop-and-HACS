name: Home Assistant integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test ./...
        working-directory: bridge
        env:
          MOMCOZY_TEST_FFMPEG: /usr/bin/ffmpeg
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg ffmpeg
      - run: python -m pip install -r tests/home_assistant/requirements.txt
      - run: python -m unittest discover -s tests/home_assistant -p test_rtsp.py -v
      - run: python -m pytest -o asyncio_mode=auto tests/home_assistant/test_integration.py
